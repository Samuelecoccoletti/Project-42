# Avvio: cd source && docker compose up --build
# Simulatore: richiede immagine locale (scripts/load-simulator-oci.sh)
#
# Healthcheck: evita che il broker parta prima che processing-1/2 siano
# registrati in DNS sulla rete compose (altrimenti: "Name or service not known").

services:
  simulator:
    image: seismic-signal-simulator:multiarch_v1
    container_name: seismic-simulator
    ports:
      - "8080:8080"
    environment:
      SAMPLING_RATE_HZ: "20"
      AUTO_SHUTDOWN_ENABLED: "true"
      AUTO_SHUTDOWN_MIN_SECONDS: "30"
      AUTO_SHUTDOWN_MAX_SECONDS: "90"

  processing-1:
    build: ./processing
    container_name: seismic-processing-1
    environment:
      REPLICA_ID: "1"
      SIMULATOR_BASE_URL: http://simulator:8080
      SAMPLING_RATE_HZ: "20"
      PORT: "8000"
    ports:
      - "8001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      - simulator

  processing-2:
    build: ./processing
    container_name: seismic-processing-2
    environment:
      REPLICA_ID: "2"
      SIMULATOR_BASE_URL: http://simulator:8080
      SAMPLING_RATE_HZ: "20"
      PORT: "8000"
    ports:
      - "8002:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      - simulator

  broker:
    build: ./broker
    container_name: seismic-broker
    environment:
      SIMULATOR_BASE_URL: http://simulator:8080
      PROCESSING_URLS: http://processing-1:8000,http://processing-2:8000
      ALL_SENSORS: "true"
      MAX_SAMPLES: "0"
      LOG_LEVEL: INFO
    depends_on:
      simulator:
        condition: service_started
      processing-1:
        condition: service_healthy
      processing-2:
        condition: service_healthy
