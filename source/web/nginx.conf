server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same origin: browser only talks to :3000; nginx forwards to the gateway.
    # Do not use Connection: close (map upgrade→close): breaks SSE/EventSource in Safari.
    location /api/ {
        proxy_pass http://gateway:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Do not set empty Connection to upstream: with SSE it can break the stream.
        gzip off;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
